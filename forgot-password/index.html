<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — EliteDent</title>
  <meta name="robots" content="noindex" />
  <link rel="preload" href="/assets/fonts/nunito-600-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/assets/fonts/nunito-700-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/assets/fonts/nunito-800-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/assets/css/fonts.css?v=2" />
  <link rel="stylesheet" href="/assets/css/auth.css?v=2" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="auth">
    <div class="auth__card">
      <a href="/">
        <img
          class="auth__logo"
          src="/assets/images/elitedentlogo.png"
          alt="EliteDent"
          width="200"
          height="56"
        />
      </a>

      <div class="auth__icon" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
        </svg>
      </div>

      <h1 class="auth__title">Reset password</h1>
      <p class="auth__subtitle">Choose a new password for your EliteDent account, then sign in from the app.</p>

      <form id="form">
        <div class="auth__field">
          <label class="auth__label" for="password">New password</label>
          <div class="auth__input-wrap">
            <span class="auth__input-icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z" />
              </svg>
            </span>
            <input
              class="auth__input"
              id="password"
              type="password"
              minlength="8"
              required
              autocomplete="new-password"
              placeholder="Minimum 8 characters"
            />
            <button type="button" class="auth__toggle" onclick="toggleVisibility('password', this)" aria-label="Show password">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </button>
          </div>
        </div>

        <div class="auth__field">
          <label class="auth__label" for="confirm">Confirm password</label>
          <div class="auth__input-wrap">
            <span class="auth__input-icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751A11.959 11.959 0 0112 2.714z" />
              </svg>
            </span>
            <input
              class="auth__input"
              id="confirm"
              type="password"
              minlength="8"
              required
              autocomplete="new-password"
              placeholder="Re-enter password"
            />
            <button type="button" class="auth__toggle" onclick="toggleVisibility('confirm', this)" aria-label="Show password">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
            </button>
          </div>
        </div>

        <button class="auth__submit" id="submitBtn" type="submit">
          <span class="auth__spinner" id="spinner"></span>
          <span id="btnText">Update password</span>
        </button>
      </form>

      <div id="message" class="auth__message" role="status"></div>
      <p class="auth__footer">EliteDent · elite-d.de</p>
    </div>
  </main>

<script>
const SUPABASE_URL = "https://rlsshhqohjfszuiweteh.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJsc3NoaHFvaGpmc3p1aXdldGVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzUyNTEsImV4cCI6MjEwMzE1MTI1MX0.ju7EsEYmtltzvXlmAV_1OulflNOyhfANDuRt53yuPL0";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const form = document.getElementById("form");
const msg = document.getElementById("message");
const btn = document.getElementById("submitBtn");
const btnText = document.getElementById("btnText");
const spinner = document.getElementById("spinner");

const EYE_OFF = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" /></svg>`;
const EYE = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>`;

function toggleVisibility(inputId, button) {
  const input = document.getElementById(inputId);
  const isPassword = input.type === "password";
  input.type = isPassword ? "text" : "password";
  button.innerHTML = isPassword ? EYE_OFF : EYE;
  button.setAttribute("aria-label", isPassword ? "Hide password" : "Show password");
}

function showMessage(text, type) {
  msg.className = "auth__message auth__message--" + type + " show";
  const icon = type === "success"
    ? `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`
    : `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" /></svg>`;
  msg.innerHTML = icon + `<span>${text}</span>`;
}

function setLoading(isLoading) {
  btn.disabled = isLoading;
  spinner.style.display = isLoading ? "block" : "none";
  btnText.textContent = isLoading ? "Updating…" : "Update password";
}

async function initializeRecovery() {
  const hash = window.location.hash.substring(1);

  if (hash) {
    const params = new URLSearchParams(hash);
    const access_token = params.get("access_token");
    const refresh_token = params.get("refresh_token");

    if (access_token && refresh_token) {
      const { error } = await supabaseClient.auth.setSession({
        access_token,
        refresh_token,
      });

      if (error) {
        showMessage(error.message, "error");
        btn.disabled = true;
      }
      return;
    }
  }

  const { data } = await supabaseClient.auth.getSession();

  if (!data.session) {
    showMessage("This password reset link is invalid or has expired.", "error");
    btn.disabled = true;
  }
}

initializeRecovery();

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  msg.classList.remove("show");

  const password = document.getElementById("password").value.trim();
  const confirm = document.getElementById("confirm").value.trim();

  if (password.length < 8) {
    showMessage("Password must be at least 8 characters long.", "error");
    return;
  }

  if (password !== confirm) {
    showMessage("Passwords do not match.", "error");
    return;
  }

  setLoading(true);

  const { error } = await supabaseClient.auth.updateUser({ password });

  setLoading(false);

  if (error) {
    showMessage(error.message, "error");
    return;
  }

  showMessage("Password updated successfully. You can return to the EliteDent app and sign in.", "success");
  btn.disabled = true;
  btnText.textContent = "Password updated";
});
</script>
</body>
</html>
