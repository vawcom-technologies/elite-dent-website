<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EliteDent — Website under construction</title>
  <meta name="description" content="The EliteDent website is under construction. We'll be back shortly." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#f4f8fc" />
  <meta name="color-scheme" content="light" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #1d3557;
      --muted: #6b7c93;
      --surface: #f4f8fc;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--surface);
      color: var(--navy);
      font-family: Nunito, system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }

    .card {
      width: min(28rem, 100%);
      padding: 2.2rem 1.8rem 2rem;
      border-radius: 1.5rem;
      background: var(--white);
      box-shadow: 0 24px 56px rgb(15 28 48 / 0.16);
      text-align: center;
    }

    .logo {
      display: block;
      width: min(220px, 70%);
      height: auto;
      margin: 0 auto 1.4rem;
    }

    .kicker {
      margin: 0 0 0.45rem;
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 0.7rem;
      font-size: clamp(1.7rem, 4vw, 2.1rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.5;
    }

    .de {
      margin-top: 0.85rem;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="assets/images/elitedentlogo-nav.png" alt="EliteDent" width="400" height="221" />
    <p class="kicker">EliteDent</p>
    <h1>Website under construction</h1>
    <p>This website is under construction. We'll be back shortly.</p>
    <p class="de" lang="de">Die Website ist gerade im Aufbau. Bald geht es hier weiter.</p>
  </main>
</body>
</html>
